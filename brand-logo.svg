<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 3200 320"
     width="3200"
     height="320">

  <defs>

    <linearGradient id="emerald"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

      <stop offset="0%" stop-color="#F8FFF9"/>
      <stop offset="18%" stop-color="#CCFFE9"/>
      <stop offset="42%" stop-color="#6BFFD0"/>
      <stop offset="60%" stop-color="#00FFA6"/>
      <stop offset="80%" stop-color="#00D98B"/>
      <stop offset="100%" stop-color="#008F63"/>

    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <text
      x="50%"
      y="50%"
      text-anchor="middle"
      dominant-baseline="middle"

      font-family="Arial, Helvetica, sans-serif"

      font-size="280"

      font-weight="650"

      letter-spacing="10"

      fill="url(#emerald)"

      filter="url(#glow)">

      KESEMPATAN OS

  </text>

</svg>
