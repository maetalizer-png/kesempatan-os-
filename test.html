<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>KESEMPATAN OS — Test Harness</title>
<style>
    body { background:#05070c; color:#E0E6ED; font-family: ui-monospace, monospace; padding: 20px; }
    h1 { color:#00FFA3; font-size: 16px; }
    #summary { font-size: 14px; margin: 14px 0; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.04); }
    .row { padding: 3px 0; font-size: 12px; }
    .pass { color: #00FFA3; }
    .fail { color: #FF6B6B; }
</style>
</head>
<body>
<h1>KESEMPATAN OS — Real Assertion Test Harness</h1>
<div id="summary">Menjalankan test...</div>
<div id="rows"></div>


<script type="module">
    import { AGENTS_CONFIG, extendBisnisAgents } from './agents/agents-config.js';
    import { extendGeneralAgents } from './agents/agents-general.js';
    import { extendGlobalAgents } from './agents/agents-global.js';
    import { extendPoliticsAgents } from './agents/agents-politics.js';
    import { extendScienceAgents } from './agents/agent-science.js';
    import './kesem-llm/llm-sampler.js';
    import './js/workflow/workflow.js'; 

    
    
    
    
    await Promise.all([
        extendBisnisAgents(),
        extendGeneralAgents(),
        extendGlobalAgents(),
        extendPoliticsAgents(),
        extendScienceAgents()
    ]);

    window.dispatchEvent(new CustomEvent('test-deps-ready'));
</script>


<script src="./test.js"></script>
<script>
    window.addEventListener('test-deps-ready', async function () {
        const report = await window.runRealAssertions();
        const summaryEl = document.getElementById('summary');
        const rowsEl = document.getElementById('rows');
        summaryEl.className = report.fail === 0 ? 'pass' : 'fail';
        summaryEl.textContent = report.pass + '/' + report.total + ' test lulus' + (report.fail ? ' — ' + report.fail + ' GAGAL' : ' — semua lulus');
        rowsEl.innerHTML = report.results.map(function (r) {
            return '<div class="row ' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? '[OK] ' : '[FAIL] ') + r.name + '</div>';
        }).join('');
        window.__testReport = report; 
    });
</script>
</body>
</html>
