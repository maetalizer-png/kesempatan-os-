<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="hubGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#C8FFEC"/>
      <stop offset="50%" stop-color="#00FFA6"/>
      <stop offset="100%" stop-color="#00D690"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="320" height="320">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .node-dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: nodePulse 2.4s ease-in-out infinite;
      }
      .node-ripple {
        transform-box: fill-box;
        transform-origin: center;
        animation: ripplePing 2.4s ease-out infinite;
        fill: none;
        stroke: #00FFA6;
        stroke-width: 2;
      }
      .hub-dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: hubPulse 2.4s ease-in-out infinite;
      }
      .hub-ripple {
        transform-box: fill-box;
        transform-origin: center;
        animation: hubRipplePing 2.4s ease-out infinite;
        fill: none;
        stroke: #00FFA6;
        stroke-width: 3;
      }
      @keyframes hubPulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.32); }
      }
      @keyframes hubRipplePing {
        0%   { transform: scale(0.7); opacity: 0.75; }
        100% { transform: scale(2.6);  opacity: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.18); }
      }
      @keyframes ripplePing {
        0%   { transform: scale(0.75); opacity: 0.55; }
        100% { transform: scale(2.1);  opacity: 0; }
      }
    </style>
  </defs>
