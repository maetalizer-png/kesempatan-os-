        // semua consumer (searchWorldData, TRN_getStaticData, dst di
        // interactive/*, podcast/*, kesem-llm/*, rap/*) sudah defensif
        // terhadap window.__STATIC_DATA kosong/belum ada (return [] / || []),
        // jadi aman ditunda sampai browser idle tanpa memblokir render awal.
        const loadWorldData = () => import('./dataries/world.js');
        if ('requestIdleCallback' in window) requestIdleCallback(loadWorldData, { timeout: 3000 });

    <script>
        if ('serviceWorker' in navigator) {
            if (new URLSearchParams(location.search).get('nosw') === '1') {
                navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
                caches?.keys().then(names => names.forEach(n => caches.delete(n)));
            } else if (location.protocol === 'https:' && location.hostname !== 'localhost') {
                window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
            }
        }
    </script>
