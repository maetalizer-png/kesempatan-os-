<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>KESEMPATAN OS - Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #03050A;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        
        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }
        
        /* SIDEBAR */
        .sidebar-left {
            width: 280px;
            background: rgba(10, 15, 28, 0.97);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
            gap: 20px;
            transition: transform 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
            position: fixed;
            left: 0;
            top: 0;
            height: 100%;
            transform: translateX(-100%);
        }
        
        .sidebar-left.open {
            transform: translateX(0);
        }
        
        .menu-toggle {
            display: block;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1001;
            background: rgba(0, 255, 163, 0.2);
            border: 1px solid rgba(0, 255, 163, 0.4);
            border-radius: 30px;
            padding: 8px 14px;
            color: #00FFA3;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }
        .menu-toggle:hover {
            background: rgba(0, 255, 163, 0.3);
            transform: scale(1.05);
        }
        
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
        }
        .sidebar-overlay.active {
            display: block;
        }
        
        .logo-area {
            padding: 8px 0 12px 0;
            border-bottom: 1px solid rgba(0, 255, 163, 0.2);
            text-align: center;
        }
        .logo-area h2 {
            color: #00FFA3;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .new-chat-btn {
            background: linear-gradient(135deg, #00FFA3, #00AA6E);
            border: none;
            border-radius: 30px;
            padding: 10px;
            color: #03050A;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            transition: all 0.2s;
        }
        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 255, 163, 0.3);
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .history-title {
            color: #A0B3C9;
            font-size: 11px;
            font-weight: 600;
        }
        .clear-history-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 11px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
        }
        .clear-history-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        
        .chat-history {
            flex: 1;
            overflow-y: auto;
            min-height: 100px;
        }
        .history-item {
            padding: 10px 12px;
            border-radius: 12px;
            color: #C0D0E5;
            font-size: 11px;
            cursor: pointer;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s;
        }
        .history-item:hover {
            background: rgba(0, 255, 163, 0.1);
            color: #00FFA3;
            transform: translateX(4px);
        }
        
        .voice-section {
            border-top: 1px solid rgba(0, 255, 163, 0.2);
            padding-top: 16px;
            margin-top: 8px;
        }
        .voice-title {
            color: #A0B3C9;
            font-size: 11px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .toggle-row span {
            font-size: 12px;
            color: #C0D0E5;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2a3a5a;
            transition: 0.3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #00FFA3;
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        
        .voice-control {
            margin-bottom: 12px;
        }
        .voice-control label {
            display: block;
            font-size: 10px;
            color: #5A6B7A;
            margin-bottom: 4px;
        }
        .voice-control select,
        .voice-control input {
            width: 100%;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 163, 0.25);
            border-radius: 16px;
            color: #E0E6ED;
            font-size: 12px;
        }
        
        .voice-preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-top: 4px;
        }
        .voice-preset-btn {
            padding: 3px 6px;
            border-radius: 8px;
            border: 1px solid rgba(0,255,163,0.15);
            background: rgba(255,255,255,0.03);
            color: #A0B3C9;
            font-size: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .voice-preset-btn:hover {
            background: rgba(0,255,163,0.08);
            border-color: rgba(0,255,163,0.3);
        }
        .voice-preset-btn.active {
            background: rgba(0,255,163,0.15);
            border-color: #00FFA3;
            color: #00FFA3;
        }
        
        /* MAIN CHAT */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #03050A;
            margin-left: 0;
            width: 100%;
        }
        
        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(0, 255, 163, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(3, 5, 10, 0.9);
            backdrop-filter: blur(10px);
        }
        .chat-header h2 {
            font-size: 14px;
            font-weight: 500;
            color: #E0E6ED;
            margin-left: 45px;
        }
        .chat-header h2 span {
            color: #00FFA3;
        }
        .chat-header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .chat-header-actions button {
            background: none;
            border: 1px solid rgba(0,255,163,0.15);
            border-radius: 20px;
            padding: 4px 10px;
            color: #A0B3C9;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
        }
        .chat-header-actions button:hover {
            border-color: #00FFA3;
            color: #00FFA3;
        }
        .chat-header-actions .back-home {
            color: #A0B3C9;
            border-color: rgba(0,255,163,0.3);
        }
        .chat-header-actions .back-home:hover {
            border-color: #00FFA3;
            color: #00FFA3;
        }
        
        /* SEARCH BAR */
        #searchBar {
            display: none;
            padding: 8px 20px;
            background: rgba(0,255,163,0.03);
            border-bottom: 1px solid rgba(0,255,163,0.05);
        }
        #searchBar.active {
            display: block;
        }
        .search-inner {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .search-inner input {
            flex: 1;
            padding: 6px 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0,255,163,0.2);
            border-radius: 20px;
            color: white;
            font-size: 11px;
            outline: none;
        }
        .search-inner input:focus {
            border-color: #00FFA3;
        }
        .search-inner button {
            padding: 4px 14px;
            background: #00FFA3;
            border: none;
            border-radius: 20px;
            color: #03050A;
            font-weight: bold;
            cursor: pointer;
            font-size: 10px;
        }
        .search-inner .close-search {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 14px;
        }
        #searchResults {
            font-size: 9px;
            color: #A0B3C9;
            margin-top: 4px;
        }
        
        /* MESSAGES — KOSONG! */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            max-width: 85%;
            margin: 0 0 16px 0;
            display: flex;
            gap: 10px;
            animation: fadeInUp 0.3s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        .message.user .message-content {
            background: linear-gradient(135deg, #00FFA3, #00AA6E);
            border-radius: 20px 20px 4px 20px;
            color: #03050A;
        }
        .message.ai .message-content {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px 20px 20px 20px;
            color: #E0E6ED;
        }
        
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 255, 163, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .message-content {
            flex: 1;
            padding: 10px 14px;
            line-height: 1.5;
            font-size: 13px;
        }
        
        /* TYPING INDICATOR */
        .typing {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .typing span {
            width: 7px;
            height: 7px;
            background: #00FFA3;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }
        
        /* INPUT AREA */
        .input-container {
            max-width: 800px;
            margin: 0 auto 20px auto;
            width: calc(100% - 40px);
            padding: 0;
        }
        
        .voice-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            justify-content: flex-end;
        }
        .voice-buttons button {
            background: rgba(0, 255, 163, 0.1);
            border: 1px solid rgba(0, 255, 163, 0.3);
            border-radius: 30px;
            padding: 5px 12px;
            color: #00FFA3;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .voice-buttons button:hover {
            background: rgba(0, 255, 163, 0.2);
        }
        .voice-buttons button.listening {
            background: rgba(255,68,68,0.15);
            border-color: #FF4444;
            color: #FF4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .input-wrapper {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 163, 0.25);
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 3px 3px 16px;
            transition: all 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: #00FFA3;
            box-shadow: 0 0 0 2px rgba(0, 255, 163, 0.1);
        }
        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 0;
            color: #E0E6ED;
            font-size: 14px;
            outline: none;
        }
        .input-wrapper input::placeholder {
            color: #5A6B7A;
        }
        .input-wrapper button {
            background: #00FFA3;
            border: none;
            border-radius: 25px;
            padding: 7px 20px;
            color: #03050A;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }
        .input-wrapper button:hover {
            transform: scale(1.02);
            box-shadow: 0 2px 8px rgba(0, 255, 163, 0.3);
        }
        .input-wrapper button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .info-note {
            font-size: 9px;
            color: #444;
            text-align: center;
            margin-top: 8px;
        }
        
        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0a0f1c; }
        ::-webkit-scrollbar-thumb { background: #00FFA3; border-radius: 4px; }
        
        /* TOAST */
        .toast-custom {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 16px;
            border-radius: 30px;
            z-index: 9999;
            font-size: 11px;
            font-weight: 600;
            animation: toastAnim 2.5s ease forwards;
        }
        .toast-custom.success {
            background: #00FFA3;
            color: #03050A;
        }
        .toast-custom.error {
            background: #FF4444;
            color: white;
        }
        .toast-custom.info {
            background: #9B59B6;
            color: white;
        }
        @keyframes toastAnim {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
        
        /* RESPONSIVE */
        @media (min-width: 769px) {
            .sidebar-left {
                position: relative;
                transform: translateX(0) !important;
                width: 260px;
            }
            .menu-toggle { display: none; }
            .main-chat { margin-left: 0; }
            .chat-header h2 { margin-left: 0; }
        }
        
        @media (max-width: 768px) {
            .message { max-width: 95%; }
            .message-content { font-size: 12px; padding: 8px 12px; }
            .chat-header h2 { font-size: 12px; margin-left: 50px; }
            .input-wrapper button { padding: 5px 14px; font-size: 12px; }
            .voice-preset-grid { grid-template-columns: repeat(2, 1fr); }
            .chat-header-actions button { font-size: 9px; padding: 3px 8px; }
        }
        
        @media (max-width: 480px) {
            .message-content { font-size: 11px; padding: 6px 10px; }
            .chat-header h2 { font-size: 11px; }
            .chat-header-actions button { font-size: 8px; padding: 2px 6px; }
            .voice-preset-grid { grid-template-columns: repeat(2, 1fr); }
            .input-container { width: calc(100% - 16px); margin-bottom: 10px; }
            .input-wrapper input { font-size: 12px; padding: 8px 0; }
            .input-wrapper button { padding: 4px 12px; font-size: 10px; }
        }
    </style>
</head>
<body>
<div class="app">
    <button class="menu-toggle" id="menuToggle">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <!-- SIDEBAR -->
    <div class="sidebar-left" id="sidebarLeft">
        <div class="logo-area">
            <h2> KESEMPATAN OS</h2>
        </div>
        
        <button class="new-chat-btn" id="newChatBtn">
            <span>+</span> Chat Baru
        </button>
        
        <div class="history-header">
            <div class="history-title">Riwayat Chat</div>
            <button class="clear-history-btn" id="clearHistoryBtn">Hapus</button>
        </div>
        <div class="chat-history" id="chatHistory">
            <div style="color: #5A6B7A; text-align: center; padding: 20px;">Belum ada chat</div>
        </div>
        
        <div class="voice-section">
            <div class="voice-title">PENGATURAN SUARA</div>
            <div class="toggle-row">
                <span>Suara</span>
                <label class="switch">
                    <input type="checkbox" id="voiceToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="voice-control">
                <label>Karakter Suara</label>
                <div class="voice-preset-grid" id="voicePresetGrid">
                    <button class="voice-preset-btn active" data-voice="professional">Profesional</button>
                    <button class="voice-preset-btn" data-voice="relaxed">Santai</button>
                    <button class="voice-preset-btn" data-voice="energetic">Energik</button>
                    <button class="voice-preset-btn" data-voice="wise">Bijak</button>
                    <button class="voice-preset-btn" data-voice="funny">Lucu</button>
                    <button class="voice-preset-btn" data-voice="robot">Robot</button>
                </div>
            </div>
            <div class="voice-control">
                <label>Kecepatan: <span id="rateLabel">1.0</span></label>
                <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1">
            </div>
            <div class="voice-control">
                <label>Nada: <span id="pitchLabel">1.0</span></label>
                <input type="range" id="pitchSlider" min="0.5" max="2" step="0.1" value="1">
            </div>
        </div>
    </div>
    
    <!-- MAIN CHAT -->
    <div class="main-chat">
        <div class="chat-header">
            <h2>Chat with <span>KESEMPATAN OS</span></h2>
            <div class="chat-header-actions">
                <button id="exportChatBtn" title="Export Chat">Export</button>
                <button id="searchToggleBtn" title="Search Chat">Cari</button>
                <button class="back-home" onclick="window.location.href='index.html'">Beranda</button>
            </div>
        </div>
        
        <!-- SEARCH BAR -->
        <div id="searchBar">
            <div class="search-inner">
                <input type="text" id="searchInput" placeholder="Cari pesan...">
                <button id="searchBtn">Cari</button>
                <button class="close-search" id="closeSearchBtn">Tutup</button>
            </div>
            <div id="searchResults"></div>
        </div>
        
        <!-- MESSAGES — KOSONG! -->
        <div class="messages-container" id="messagesContainer"></div>
        
        <div class="input-container">
            <div class="voice-buttons">
                <button id="voiceInputBtn">Input Suara</button>
                <button id="stopVoiceBtn" style="display: none;">Berhenti</button>
            </div>
            
            <div class="input-wrapper">
                <input type="text" id="chatInput" placeholder="Ketik pertanyaan bisnis... (Enter untuk kirim)">
                <button id="sendBtn">Kirim</button>
            </div>
            
            <div class="info-note">
                Coba tanya: "bisnis modal kecil", "strategi marketing TikTok", atau "analisis ide usaha frozen food"
            </div>
        </div>
    </div>
</div>

<script>
    // ========== KESEMPATAN OS ==========
    // DEITY EDITION — LAYAR CHAT BERSIH + TANPA QUICK REPLY
    
    (function() {
        "use strict";
        
        let knowledgeBase = {
            bisnis: {
                keywords: ['bisnis', 'usaha', 'jualan', 'dagang', 'wirausaha', 'startup', 'bisnis online', 'usaha sampingan', 'ide bisnis'],
                response: function(msg, context, sentiment) {
                    return '**Panduan Memulai Bisnis untuk Pemula:**\n\n' +
                        '**1. VALIDASI IDE** - Jangan langsung investasi besar. Tanya ke 10 calon customer dulu.\n\n' +
                        '**2. KENALI CUSTOMER** - Buat profil: umur, pekerjaan, masalah yang dihadapi.\n\n' +
                        '**3. MULAI DARI MVP** - Produk minimal yang bisa dijual. Contoh: 3 varian rasa dulu, bukan 20.\n\n' +
                        '**4. UNIT EKONOMI POSITIF** - Harga Jual - (Biaya Produksi + Marketing) = PROFIT\n\n' +
                        '**5. FEEDBACK LOOP** - Setiap customer kasih feedback, catat! Itu emas.\n\n' +
                        '**Ide Bisnis Modal Kecil:** Thrift shop, frozen food, digital product (template/e-book), jasa edit video, dropshipping.\n\n' +
                        (context ? '*Dari chat sebelumnya: ' + context.substring(0, 100) + '*\n\n' : '') +
                        '**Butuh detail lebih lanjut?** Ceritain ide spesifik Bos!';
                }
            },
            marketing: {
                keywords: ['marketing', 'pemasaran', 'promosi', 'branding', 'iklan', 'ads', 'instagram', 'tiktok', 'facebook', 'social media'],
                response: function(msg, context, sentiment) {
                    return '**Strategi Marketing Jitu 2025:**\n\n' +
                        '**1. CONTENT MARKETING** - Bikin konten BERGUNA, jangan jualan mulu. Rasio 80:20.\n\n' +
                        '**2. TIKTOK & REELS** - Konten viral, jangkauan luas, GRATIS!\n\n' +
                        '**3. SOCIAL PROOF** - Kumpulkan testimoni, kasih rating, tampilkan "1000+ customer puas"\n\n' +
                        '**4. REFERRAL PROGRAM** - Diskon untuk customer yang ajak teman.\n\n' +
                        '**5. IKLAN BERBAYAR** - Mulai dari Rp50.000/hari di TikTok Ads atau IG Ads.\n\n' +
                        '**Tool Gratis:** Canva (desain), CapCut (edit video), Buffer (schedule posting)\n\n' +
                        (context ? '*Dari chat sebelumnya: ' + context.substring(0, 100) + '*\n\n' : '') +
                        '**Mau strategi spesifik untuk produk Bos?** Ceritain!';
                }
            },
            keuangan: {
                keywords: ['keuangan', 'modal', 'investasi', 'profit', 'rugi', 'cashflow', 'hutang', 'uang', 'gaji', 'tabungan'],
                response: function(msg, context, sentiment) {
                    return '**Mengelola Keuangan Bisnis:**\n\n' +
                        '**GOLDEN RULE:** Pisahkan uang pribadi dan uang bisnis! Buka rekening terpisah.\n\n' +
                        '**1. CATAT SEMUA** - Pemasukan & pengeluaran setiap hari. Pake Excel atau aplikasi.\n\n' +

        function speakText(text) {
            if (!voiceEnabled || !synth) return;
            if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
            
            let cleanText = text.replace(/\*{1,2}([^*]+)\*{1,2}/g, '$1')
                .substring(0, 600);
            
            let preset = VOICE_PRESETS[currentVoice] || VOICE_PRESETS.professional;
            let utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = preset.rate * voiceRate;
            utterance.pitch = preset.pitch * voicePitch;
            utterance.lang = 'id-ID';
            
            let voiceList = window.speechSynthesis.getVoices();
            let indonesianVoice = voiceList.find(function(v) { return v.lang === 'id-ID' || v.lang === 'id'; });
            if (indonesianVoice) utterance.voice = indonesianVoice;
            
            window.speechSynthesis.speak(utterance);
        }
        
        function findTopic(message) {
            let lowerMsg = message.toLowerCase();
            for (let topic in knowledgeBase) {
                let data = knowledgeBase[topic];
                if (data.keywords && data.keywords.some(function(kw) { return lowerMsg.indexOf(kw) !== -1; })) {
                    return data;
                }
            }
            return null;
        }
        
        function analyzeSentiment(message) {
            let lowerMsg = message.toLowerCase();
            let positive = ['senang', 'sukses', 'hore', 'laku', 'untung', 'lancar', 'gas', 'mantap'];
            let negative = ['sedih', 'capek', 'lelah', 'gagal', 'bangkrut', 'stress', 'down'];
            
            let posCount = 0, negCount = 0;
            positive.forEach(function(kw) { if (lowerMsg.indexOf(kw) !== -1) posCount++; });
            negative.forEach(function(kw) { if (lowerMsg.indexOf(kw) !== -1) negCount++; });
            
            if (negCount > posCount) return 'negative';
            if (posCount > negCount) return 'positive';
            return 'neutral';
        }

                if (m === '>') return '&gt;';

        function initVoiceInput() {
            if (!voiceInputBtn) return;
            
            if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                voiceInputBtn.style.display = 'none';
                return;
            }
            
            let SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'id-ID';
            
            recognition.onstart = function() {
                isListening = true;
                voiceInputBtn.textContent = 'Berhenti';
                voiceInputBtn.classList.add('listening');
                if (stopVoiceBtn) stopVoiceBtn.style.display = 'inline-block';
                showToast('Dengarkan...', 'info');
            };
            
            recognition.onend = function() {
                isListening = false;
                voiceInputBtn.textContent = 'Input Suara';
                voiceInputBtn.classList.remove('listening');
                if (stopVoiceBtn) stopVoiceBtn.style.display = 'none';
            };
            
            recognition.onresult = function(event) {
                let result = event.results[0][0].transcript;
                chatInput.value = result;
                showToast('"' + result + '"', 'success');
                sendMessage();
            };
            
            recognition.onerror = function() {
                showToast('Gagal menangkap suara', 'error');
                isListening = false;
                voiceInputBtn.textContent = 'Input Suara';
                voiceInputBtn.classList.remove('listening');
                if (stopVoiceBtn) stopVoiceBtn.style.display = 'none';
            };
            
            voiceInputBtn.onclick = function() {
                if (isListening) {
                    if (recognition) recognition.stop();
                    return;
                }
                if (recognition) recognition.start();
            };
            
            if (stopVoiceBtn) {
                stopVoiceBtn.onclick = function() {
                    if (recognition) recognition.stop();
                    isListening = false;
                    voiceInputBtn.textContent = 'Input Suara';
                    voiceInputBtn.classList.remove('listening');
                    stopVoiceBtn.style.display = 'none';
                };
            }
        }

        async function sendMessage() {
            if (isLoading) return;
            let message = chatInput.value.trim();
            if (!message) return;
            
            chatInput.value = '';
            isLoading = true;
            if (sendBtn) sendBtn.disabled = true;
            
            currentMessages.push({ role: 'user', content: message, timestamp: Date.now() });
            addToContext('user', message);
            renderMessages();
            showTyping();
            saveHistory();
            
            try {
                let context = getContext();
                let response = await callRealAI(message);
                hideTyping();
                currentMessages.push({ role: 'assistant', content: response, timestamp: Date.now() });
                addToContext('assistant', response);
                renderMessages();
                saveHistory();
                speakText(response);
            } catch (error) {
                hideTyping();
                currentMessages.push({ role: 'assistant', content: 'Maaf Bos, ada gangguan. Coba lagi ya!', timestamp: Date.now() });
                renderMessages();
                showToast('Error: ' + error.message, 'error');
            } finally {
                isLoading = false;
                if (sendBtn) sendBtn.disabled = false;
                chatInput.focus();
            }
        }

            document.getElementById('searchBtn')?.addEventListener('click', function() {
                let query = document.getElementById('searchInput').value.trim();
                searchChat(query);
            });
            
            document.getElementById('searchInput')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    let query = this.value.trim();
                    searchChat(query);
                }
            });
            
            document.getElementById('closeSearchBtn')?.addEventListener('click', function() {
                document.getElementById('searchBar').style.display = 'none';
                document.getElementById('searchResults').textContent = '';
                document.querySelectorAll('.message .message-content').forEach(function(el) {
                    el.style.background = '';
                    el.style.border = '';
                });
            });
            
            loadVoices();
            loadHistory();
            initVoiceInput();
            setTimeout(loadVoices, 500);
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initUI);
        } else {
            initUI();
        }
        
        window.showToast = showToast;
        window.exportChat = exportChat;
        window.searchChat = searchChat;
    })();
</script>
</body>
</html>
